<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Yoguiscoin Wallet</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
</head>
<body>

<header>
  <img src="assets/yoguiscoin.png" class="logo">
  <h1>Yoguiscoin Wallet</h1>
</header>

<section class="card">
  <p><b>Estudiante:</b> <span id="student"></span></p>
  <p><b>Wallet ID:</b> <span id="wallet"></span></p>
  <p><b>Balance:</b> <span id="balance">0</span> YGC</p>
  <p><b>Nivel:</b> <span id="level"></span></p>
</section>

<section class="card">
  <h2>Historia Yoguiscoin (Velas Japonesas)</h2>
  <canvas id="candlesChart"></canvas>
</section>

<script src="js/config.js"></script>
<script src="js/ledger.js"></script>
<script src="js/wallet.js"></script>
<script src="js/candles.js"></script>

</body>
</html>
